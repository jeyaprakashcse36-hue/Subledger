services:
  db:
    image: postgres:16
    container_name: subledger-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subledger_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - subledger_data:/var/lib/postgresql/data
    
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: subledger-app
    environment:
      APP_NAME: ${APP_NAME:-SubLedger}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subledger_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  subledger_data:
